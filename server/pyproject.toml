[project]
name = "orchard"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.8",
    "nanoid>=2.0.0",
    "django-allauth[socialaccount]>=65.14.1",
    "python-dotenv>=1.0.1",
    "django-hijack>=3.7.1",
    "debugpy>=1.8.11",
    "rules>=3.5",
    "names>=0.3.0",
    "cryptography>=44.0.0",
    "huey>=2.5.4,<3",
    "redis>=5.2.1",
    "httpx>=0.28.1",
    "django-simple-history>=3.8.0",
    "typesense>=1.1.1",
    "tenacity>=9.1.2",
    "gunicorn>=23.0.0",
    "sentry-sdk[django]>=2.61.0,<3",
    "django-cors-headers>=4.7.0",
    "jsonata-python>=0.6.1",
    "django-waffle>=5.0.0",
    "aiohttp-s3-client>=1.0.0",
    "loguru>=0.7.3",
    "msgspec>=0.21.1",
    "pillow>=12.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "orchard.settings"
pythonpath = ["."]
env = [
    "DJANGO_SECRET_KEY = asfawefawef",
    "DEBUG = true",
    "DOMAIN_URL = http://localhost:8000",
    "DISCORD_PUBLIC_KEY = 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef",
    "DISCORD_BOT_TOKEN = test_bot_token",
    "DISCORD_CLIENT_ID = test_client_id",
    "DISCORD_CLIENT_SECRET = test_client_secret",
    "TYPESENSE_API_KEY = test_api_key",
    "TYPESENSE_API_HOST = localhost",
    "TYPESENSE_API_PORT = 8108",
    "TYPESENSE_API_PROTOCOL = http",
    "REDIS_HOST = ",
    "REDIS_PORT = ",
    "S3_API_URL = ",
    "S3_ACCESS_KEY_ID = ",
    "S3_SECRET_ACCESS_KEY = ",
    "S3_REGION = ",
    "S3_PUBLIC_CDN_URL = "
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-django>=4.11.1",
    "pytest-env>=1.1.5",
    "freezegun>=1.5.5",
    "syrupy>=4.9.1",
    "django-stubs>=6.0.5",
    "mypy>=2.4.0",
    "ty>=0.0.6",
    "types-nanoid>=2.0.0.20260508",
]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = ["allauth.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "orchard.settings"
